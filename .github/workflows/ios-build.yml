name: iOS Build + TestFlight

on:
  workflow_dispatch: {}
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore Apple credentials
        env:
          APPLE_CREDS: ${{ secrets.APPLE_CREDS }}
        run: echo "$APPLE_CREDS" | base64 -d | tar xz

      - name: Restore Expo session
        env:
          EXPO_STATE: ${{ secrets.EXPO_STATE }}
        run: |
          mkdir -p ~/.expo
          echo "$EXPO_STATE" | base64 -d > ~/.expo/state.json

      - name: Install EAS CLI + deps
        run: |
          npm install -g eas-cli
          npm install

      - name: Verify Expo session
        run: |
          eas whoami || (echo "Expo-Session ungueltig -> EXPO_STATE-Secret erneuern"; exit 1)

      # Build-Nummer MUSS pro Lauf steigen: mit appVersionSource=local + autoIncrement
      # startete jeder CI-Lauf bei der committeten Zahl und kollidierte beim Upload
      # ("Build number 105 ... has already been used"). Deshalb: höchste bei Apple
      # vorhandene Build-Nummer dieser Version + 1 (ASC ist die Quelle der Wahrheit).
      # Fallback (kein Key / ASC down): committete buildNumber aus app.json.
      - name: Build-Nummer setzen
        run: |
          BUILD=$(node scripts/next-build-number.mjs)
          node -e "const fs=require('fs');const p='app.json';let s=fs.readFileSync(p,'utf8');s=s.replace(/\"buildNumber\":\s*\"[0-9]+\"/,'\"buildNumber\": \"'+process.argv[1]+'\"');fs.writeFileSync(p,s)" "$BUILD"
          grep -n 'buildNumber' app.json

      # Kein CI=1 im Build-Step: mit CI=1 verlangt die EAS-CLI zwingend EXPO_TOKEN
      # und ignoriert die restaurierte Session (.expo/state.json aus EXPO_STATE).
      - name: Build iOS (local, umgeht EAS-Cloud-Kontingent)
        env:
          EXPO_PUBLIC_API_TOKEN: ${{ secrets.EXPO_PUBLIC_API_TOKEN }}
        run: eas build --platform ios --profile production --non-interactive --local

      - name: Submit to TestFlight
        env:
          CI: 1
        run: |
          IPA=$(find . /private/var/folders -name "*.ipa" -not -path "*/node_modules/*" 2>/dev/null | head -1)
          echo "IPA gefunden: $IPA"
          if [ -z "$IPA" ]; then echo "Keine .ipa gefunden"; exit 1; fi
          eas submit --platform ios --profile production --non-interactive --path "$IPA"

      # Nach dem Upload den Build der internen Tester-Gruppe zuweisen, sonst taucht er
      # in TestFlight unter "Interne Tester" nicht auf.
      - name: Build internen Testern zuweisen
        env:
          APPLE_CREDS: ${{ secrets.APPLE_CREDS }}
        run: |
          if [ -f scripts/assign-testflight-group.mjs ]; then node scripts/assign-testflight-group.mjs; else echo "kein Skript"; fi
